version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: gestionbovins-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gestionbovins
      MYSQL_USER: gestionbovins
      MYSQL_PASSWORD: gestionbovins_secure_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/dump.sql:/docker-entrypoint-initdb.d/dump.sql
    networks:
      - gestionbovins-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Laravel PHP Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: php
    container_name: gestionbovins-app
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: gestionbovins
      DB_USERNAME: gestionbovins
      DB_PASSWORD: gestionbovins_secure_password
      APP_ENV: local
      APP_DEBUG: "true"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./:/var/www/html
    networks:
      - gestionbovins-network
    working_dir: /var/www/html
    command: php-fpm

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: gestionbovins-nginx
    ports:
      - "8000:80"
      - "443:443"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./docker/ssl:/etc/nginx/ssl
    depends_on:
      - app
    networks:
      - gestionbovins-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      timeout: 10s
      retries: 5

networks:
  gestionbovins-network:
    driver: bridge

volumes:
  mysql_data:
